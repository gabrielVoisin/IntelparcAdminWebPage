[project]
name = "parking-platform"
version = "1.0.0"
description = "Parking management platform: web back office, REST API for Android and Raspberry Pi control cabinets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30,<3.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pyjwt>=2.8",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/sql/*.sql", "locales/*.json", "web/templates/*.html", "web/templates/**/*.html", "web/static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
