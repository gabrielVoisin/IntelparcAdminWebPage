<!doctype html>
<html lang="{{ locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('login.title') }} · {{ t('app.name') }}</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login">
  <form class="card" method="post" action="/login">
    <div class="brand" style="padding:0">
      <div class="logo" aria-hidden="true" style="color:#fff">P</div>
      <div><div class="name">{{ t('app.site_name') }}</div><div class="muted" style="font-size:13px">{{ t('app.back_office') }}</div></div>
    </div>
    <h1 style="margin:0;font-size:26px">{{ t('login.title') }}</h1>
    {% if error %}<p class="notice" role="alert" style="border-color:var(--red);color:var(--red-dark);background:var(--red-soft)">{{ t(error) }}</p>{% endif %}
    <label class="field">{{ t('login.email') }}<input class="input" type="email" name="email" autocomplete="username" required></label>
    <label class="field">{{ t('login.password') }}<input class="input" type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" type="submit">{{ t('login.submit') }}</button>
    <div class="langs" style="gap:8px">
      {% for code in locales %}<a href="/lang/{{ code }}" style="color:var(--ink);border-color:var(--line-2)" aria-current="{{ 'true' if code == locale else 'false' }}">{{ code|upper }}</a>{% endfor %}
    </div>
  </form>
</div>
</body>
</html>
